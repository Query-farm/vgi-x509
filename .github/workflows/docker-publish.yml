# Copyright 2026 Query Farm LLC - https://query.farm
#
# Build and publish the multi-arch vgi-x509 image to ghcr.io. The heavy lifting
# (multi-arch build -> per-arch /health boot smoke -> image SQL suite -> push ->
# manifest -> cosign-sign + attest) lives in the shared reusable workflow
# Query-farm/vgi-actions; this file gates on the repo's own CI suite and
# supplies the worker-specific inputs.
#
# Tag-driven: vX.Y.Z -> :X.Y.Z/:X.Y/:latest, push to main -> :edge. Publishing a
# GitHub Release creates the tag, which fires this too.
name: Publish image to ghcr.io

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate every image on the full unit + vgi-extension integration suite, so a
  # broken worker is never imaged.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-x509
      # Go binary — nothing to `import`, so the language-import smoke is skipped.
      # The reusable workflow still runs its dual-arch HTTP /health boot smoke.
      smoke_import: ""
      health_port: "8000"
      # No ci/check-version.sh in this repo, so version_check_cmd is omitted.
      #
      # Validate the built image's transports against the signed vgi extension.
      # The worker *logic* is already exercised every run by the gating `ci` job
      # (all test/sql/*, three transports, both with the mock TLS server). Here
      # we only prove the IMAGE's entrypoints speak the protocol, using the
      # OFFLINE certificate suite (cert_offline.test) — tls_inspect needs a mock
      # TLS backend the image_test runner has no reachable copy of, so SKIP_MOCK
      # is set and tls_inspect.test require-env-SKIPs itself:
      #   - stdio: smoke the offline file through `docker run … stdio` (on-host);
      #   - HTTP : the offline file against a SINGLE warm container (end-to-end
      #            image check via the default `http` entrypoint + /health), fed
      #            to run-integration.sh as a pre-launched http:// LOCATION.
      # $CITEST_IMAGE is the loaded <image>:citest-amd64 ref; GH_TOKEN is
      # provided for the haybarn download.
      image_test: |
        echo "::group::download haybarn-unittest"
        REL=$(gh release view --repo Query-farm-haybarn/haybarn --json tagName --jq .tagName)
        gh release download "$REL" --repo Query-farm-haybarn/haybarn \
          --pattern 'haybarn_unittest-linux-amd64.zip' --output hb.zip --clobber
        mkdir -p hb && unzip -o -q hb.zip -d hb
        export HAYBARN_UNITTEST="$PWD/$(find hb -name 'haybarn-unittest' -type f | head -1)"
        chmod +x "$HAYBARN_UNITTEST"
        echo "::endgroup::"

        echo "::group::stdio entrypoint smoke (one offline file, cold container per ATTACH)"
        TRANSPORT=subprocess \
          SKIP_MOCK=1 \
          TEST_PATTERN="test/sql/cert_offline.test" \
          VGI_X509_WORKER="docker run -i --rm $CITEST_IMAGE stdio" \
          ci/run-integration.sh
        echo "::endgroup::"

        echo "::group::offline SQL suite — HTTP transport (one warm container)"
        CID=$(docker run -d -p 18000:8000 "$CITEST_IMAGE")
        trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18000/health && break; sleep 1; done
        TRANSPORT=http \
          SKIP_MOCK=1 \
          TEST_PATTERN="test/sql/cert_offline.test" \
          VGI_X509_WORKER="http://localhost:18000" \
          ci/run-integration.sh
        echo "::endgroup::"
